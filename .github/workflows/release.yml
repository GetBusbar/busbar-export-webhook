# RENDERED by `busbar-release plugin sync busbar-export-webhook` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@324e30d2b0725c9dc8538580b691a487b336a954
    with:
      plugin_crate: busbar-export-webhook-plugin
      manifest_name: busbar-export-webhook
      plugin_alias: request-log-webhook
      plugin_kind: export
      asset_prefix: busbar-export-webhook
      description: "First-party signed kind:export plugin cdylib: the request-log WEBHOOK sink (module: request-log-webhook), packaged as a droppable busbar plugin. Drop the signed tarball into plugins/ and name it from an export.<name>.module: request-log-webhook block."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "export-webhook/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@324e30d2b0725c9dc8538580b691a487b336a954
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-export-webhook
      plugin_name: busbar-export-webhook
      plugin_alias: request-log-webhook
      plugin_kind: export
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
