# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-export-webhook"
version = "1.5.0"
edition = "2021"
rust-version = "1.97"
description = "The request-log WEBHOOK export sink as a kind:export plugin: POSTs each request-log line to the operator's https:// target through the host's egress carrier (it never dials), linked into the busbar binary or dropped into plugins/ — one crate, one registration."
license = "Apache-2.0"
publish = false

[lib]
# rlib: THE LOGIC. The busbar composition root links it (its `linked::EXPORT` row and
# `BUSBAR_COLD_ENTRY`), and the sibling `busbar-export-webhook-plugin` cdylib re-exports it as the
# dropped-in door. One source, both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`, so a plugin's busbar closure is exactly busbar-contract). Pinned by
# git rev to the busbar commit in `.busbar-ref`; a busbar build that links this crate `[patch]`es the
# busbar git source to its own tree, so ONE copy of the contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "7a5b429041752e00375e120ab1547a8928c3dee4" }
# The settings shape (`deny_unknown_fields`, so the operator's typo is the same refusal it was).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The userinfo mask on the target URL the sink's diagnostics name (its own lines, never the host's).
url = "2"
