# SPDX-License-Identifier: Apache-2.0
#
# One repo per plugin (owner ruling, busbar 1.6.0): this repo brings 100% of what the request-log
# WEBHOOK export sink (`module: request-log-webhook`) needs — the sink logic (busbar-export-webhook,
# the rlib busbar's composition root links) and the thin cdylib that packages it as a droppable
# `kind: export` plugin (busbar-export-webhook-plugin) — as a same-repo Cargo workspace, laid out like
# store-mysql.
#
# Its one busbar dependency is busbar-plugin-sdk (busbar-plugin-loader too, dev-only for the
# conformance test), a git dependency on GetBusbar/busbar pinned to the rev in `.busbar-ref`
# field 1. No sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "export-webhook",
    "export-webhook-plugin",
]
